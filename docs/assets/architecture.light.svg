<svg xmlns="http://www.w3.org/2000/svg" width="880" height="546" viewBox="0 0 880 546" role="img" aria-labelledby="title desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="title">Atlantis DB architecture</title>
<desc id="desc">Layers from top: atlantis-engine (transactions, Cypher execution, derived indexes); atlantis-cypher (hand-written lexer and parser · planner (planned)); atlantis-vector (HNSW, SIMD kernels, vector arena), atlantis-text (BM25 inverted index, planned); atlantis-storage (records, edges, adjacency, table catalog); atlantis-kv (ordered transactional KV, MVCC, write-ahead log, checkpoints); atlantis-core (values, record ids, errors, config)</desc>
