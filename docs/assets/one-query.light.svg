<svg xmlns="http://www.w3.org/2000/svg" width="880" height="424" viewBox="0 0 880 424" role="img" aria-labelledby="title desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="title">Three systems today, one query in Atlantis DB</title>
<desc id="desc">Today an agent queries a vector store, a search engine and a graph database over the network, with sync jobs between them. With Atlantis DB one Cypher query runs vector, BM25 and graph retrieval on one MVCC snapshot inside the application process.</desc>
<defs><marker id="arrow-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#52514e"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6f6d68"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2a78d6"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="423" rx="12" fill="#fcfcfb" stroke="#dcdbd3"/>
<rect x="24" y="24" width="404" height="376" rx="10" fill="#fcfcfb" stroke="#dcdbd3" stroke-width="1"/>
