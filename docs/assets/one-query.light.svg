<text x="226.0" y="263" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">keywords</text>
<line x1="226.0" y1="142" x2="352.0" y2="216" stroke="#6f6d68" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
<rect x="296" y="220" width="112" height="56" rx="8" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="352.0" y="244" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Graph DB</text>
<text x="352.0" y="263" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">relations</text>
<text x="316" y="174" font-size="12.5" font-weight="400" fill="#6f6d68" text-anchor="start">3 network hops</text>
<path d="M100.0,276 V306 H352.0 V276" fill="none" stroke="#6f6d68" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="226.0" y1="276" x2="226.0" y2="306" stroke="#6f6d68" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<rect x="178.0" y="295" width="96" height="22" rx="4" fill="#fcfcfb" stroke="none"/>
<text x="226.0" y="310.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" font-style="italic">sync jobs</text>
<text x="44" y="354" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">3 queries, 3 consistency models, 3 permission models.</text>
<text x="44" y="374" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Search can't see the write the agent just made.</text>
