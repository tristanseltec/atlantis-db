<rect x="710.6666666666666" y="212" width="97.33333333333333" height="46" rx="8" fill="#1baf7a" fill-opacity="0.14" stroke="#1baf7a" stroke-width="1.5"/>
<text x="759.3333333333333" y="232" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Graph</text>
<text x="759.3333333333333" y="249" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">traversal</text>
<rect x="500" y="272" width="308" height="30" rx="6" fill="#2a78d6" fill-opacity="0.14" stroke="#2a78d6" stroke-width="1.5"/>
<text x="654.0" y="292" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">One MVCC snapshot · ACID</text>
<text x="472" y="354" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">1 query, 1 transaction, no network hop.</text>
<text x="472" y="374" font-size="13" font-weight="400" fill="#6f6d68" text-anchor="start">BM25 and read-your-writes search: in progress (F4, F5).</text>
