<rect x="44" y="220" width="112" height="56" rx="8" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1"/>
<text x="100.0" y="244" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Vector store</text>
<text x="100.0" y="263" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">embeddings</text>
<line x1="226.0" y1="142" x2="226.0" y2="216" stroke="#6f6d68" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
