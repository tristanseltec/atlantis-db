<title id="title">F2 vector core: before and after</title>
<desc id="desc">Index build: before 185.8 s, after 20.9 s (8.9× faster); Vector top-10, p50: before 1.87 ms, after 0.27 ms (6.9× faster); Graph-RAG, 8 threads: before 225 QPS, after 3,041 QPS (13.5× the throughput). Recall@10 stays 1.000.</desc>
