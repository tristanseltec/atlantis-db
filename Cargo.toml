[workspace]
resolver = "2"
members = [
    "crates/atlantis-core",
    "crates/atlantis-kv",
    "crates/atlantis-storage",
    "crates/atlantis-vector",
    "crates/atlantis-cypher",
    "crates/atlantis-engine",
    "crates/atlantis-db",
    "benches",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Atlantis DB Contributors"]
repository = "https://github.com/tristanseltec/atlantis-db"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = "1.3"
thiserror = "1.0"
tracing = "0.1"

# Async runtime
tokio = { version = "1.40", features = ["full"] }


# Internal crates
atlantis-core = { path = "crates/atlantis-core" }
atlantis-kv = { path = "crates/atlantis-kv" }
atlantis-storage = { path = "crates/atlantis-storage" }
atlantis-vector = { path = "crates/atlantis-vector" }
atlantis-cypher = { path = "crates/atlantis-cypher" }
atlantis-engine = { path = "crates/atlantis-engine" }

# Dev dependencies
proptest = "1.5"
criterion = "0.5"
anyhow = "1.0"
tempfile = "3.10"
rand = "0.8"
